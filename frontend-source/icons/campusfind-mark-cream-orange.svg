<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Magnifier Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA040"/>
      <stop offset="50%" stop-color="#FF6B18"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D4C41"/>
      <stop offset="50%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#211512"/>
    </linearGradient>

    <!-- Metal Collar Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="50%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#546E7A"/>
    </linearGradient>

    <!-- Star & Glow Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <radialGradient id="starAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FFB300" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
    </radialGradient>

    <!-- Cap Plate Gradient (Charcoal Academic Silk) -->
    <linearGradient id="capTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="50%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <!-- Cap Skull Base Gradient -->
    <linearGradient id="capBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#373737"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>

    <!-- Golden Tassel Gradient -->
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>

    <!-- Lens Glass Reflection Gradient -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFE0B2" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Magnifier Handle (Bottom-Right, angled 45deg) -->
  <g transform="translate(68, 68) rotate(45)">
    <rect x="-3" y="0" width="6" height="5" rx="1.5" fill="url(#metalGrad)"/>
    <rect x="-4" y="5" width="8" height="22" rx="4" fill="url(#handleGrad)"/>
    <rect x="-2" y="7" width="2.5" height="18" rx="1.2" fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- Magnifier Outer Rim -->
  <circle cx="50" cy="54" r="28" fill="none" stroke="url(#rimGrad)" stroke-width="8"/>
  <circle cx="50" cy="54" r="24" fill="none" stroke="#BF360C" stroke-width="0.8" opacity="0.6"/>
  <path d="M 28 40 A 28 28 0 0 1 72 40" fill="none" stroke="#FFE0B2" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>

  <!-- Lens Glass Interior -->
  <circle cx="50" cy="54" r="23.5" fill="url(#lensGlass)"/>
  <path d="M 31 47 A 23.5 23.5 0 0 1 69 47" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Discovery Star Glow Aura -->
  <circle cx="50" cy="54" r="19" fill="url(#starAura)"/>

  <!-- 4-Point Radiant Discovery Star (Centered in Lens) -->
  <path d="M 50 40 Q 50 54 40 54 Q 50 54 50 68 Q 50 54 60 54 Q 50 54 50 40 Z" fill="url(#starGrad)"/>
  <circle cx="50" cy="54" r="2.2" fill="#FFFFFF" opacity="0.9"/>

  <!-- Graduation Cap Skull Base (sits level atop lens rim) -->
  <path d="M 36 34 Q 50 37 64 34 L 62 25 Q 50 28 38 25 Z" fill="url(#capBaseGrad)" stroke="#1A1A1A" stroke-width="0.5"/>
  <path d="M 38 33 Q 50 36 62 33" fill="none" stroke="#FF9800" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

  <!-- Graduation Cap Mortarboard Plate (Square diamond, level & horizontal) -->
  <polygon points="50,14 78,25 50,36 22,25" fill="url(#capTopGrad)" stroke="#111111" stroke-width="0.8"/>
  <polyline points="22,25 50,36 78,25" fill="none" stroke="#FFA726" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="50" cy="24.5" rx="3" ry="1.5" fill="#FFB300"/>

  <!-- Golden Tassel & Cord -->
  <path d="M 50 24.5 Q 66 22 74 29 Q 78 33 76 38" fill="none" stroke="url(#tasselGrad)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="76" cy="38" r="2.2" fill="#FFD54F" stroke="#F57F17" stroke-width="0.6"/>
  <path d="M 74 40 L 78 40 L 81 52 L 72 52 Z" fill="url(#tasselGrad)"/>
  <line x1="75" y1="40" x2="74" y2="52" stroke="#FFF59D" stroke-width="0.6"/>
  <line x1="77" y1="40" x2="78" y2="52" stroke="#FFF59D" stroke-width="0.6"/>
</svg>
