# Production profile: PostgreSQL database (Railway, Neon, Supabase, etc.)
# Handled dynamically by DatabaseConfig.java from DATABASE_URL, DATABASE_PUBLIC_URL,
# SPRING_DATASOURCE_URL, or PG* environment variables.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Secure cookies for production behind HTTPS
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
