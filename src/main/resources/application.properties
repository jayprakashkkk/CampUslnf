spring.application.name=CampusFind
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

campusfind.owner-username=${CAMPUSFIND_OWNER_USERNAME:}

# Optional Gmail SMTP configuration for password reset. Configure in Render Environment.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
campusfind.reset-otp-minutes=${RESET_OTP_MINUTES:10}
