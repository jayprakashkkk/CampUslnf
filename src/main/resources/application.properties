spring.application.name=CampusFind
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Reverse proxy / SSL termination support (Railway, Render, etc.)
server.forward-headers-strategy=framework

# Session cookie configuration (secure default for local)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Upload and request payload size limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
server.tomcat.max-http-form-post-size=15MB
server.tomcat.max-swallow-size=15MB

campusfind.owner-username=${CAMPUSFIND_OWNER_USERNAME:}

# Email Configuration (Brevo / Sendinblue / Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

# Sender Display Name & From Address
campusfind.mail.sender-name=${MAIL_SENDER_NAME:CampUs | Lost & Found}
campusfind.mail.from=${MAIL_FROM:${spring.mail.username:}}
campusfind.reset-otp-minutes=${RESET_OTP_MINUTES:10}
